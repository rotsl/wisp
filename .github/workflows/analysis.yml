name: Wisp Analysis & Reporting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build and test
      run: |
        python scripts/build.py
        python tests/test_scanner.py
    
    - name: Generate reports
      run: |
        mkdir -p reports/analysis
        echo "# Wisp Analysis Report" > reports/analysis/index.md
        echo "Generated: $(date -u)" >> reports/analysis/index.md
        echo "Commit: ${{ github.sha }}" >> reports/analysis/index.md
        echo "" >> reports/analysis/index.md
        
        # Analyze fixtures
        for fixture in tests/fixtures/*.html; do
          echo "## $(basename $fixture)" >> reports/analysis/index.md
          python3 -c "
        import sys
        sys.path.insert(0, '.')
        from src.core.scanner import WispScanner
        with open('$fixture') as f:
            s = WispScanner(f.read())
            a = s.analyze()
        print(f'- **Context:** {a.context}')
        print(f'- **Pattern:** {a.pattern}')
        print(f'- **Density:** {a.density:.4f}')
        print(f'- **Depth:** {a.depth}')
        " >> reports/analysis/index.md
        done
        
        # Live examples
        python -m src.core.fetcher https://en.wikipedia.org/wiki/Wiki --css-only -o reports/analysis/wiki.css 2>&1 | tee -a reports/analysis/index.md || true
        
        # Dashboard and dist files
        python scripts/generate_dashboard.py
        cp public/dashboard.html reports/dashboard.html
        cp -r dist reports/
        
        # Create index.html for easy navigation
        cat > reports/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
          <title>Wisp Analysis</title>
          <meta charset="UTF-8">
          <style>
            body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
            h1 { color: #333; border-bottom: 2px solid #0066cc; padding-bottom: 10px; }
            .nav { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
            .nav a { 
              background: #0066cc; color: white; padding: 10px 20px; 
              border-radius: 4px; text-decoration: none; 
            }
            .nav a:hover { background: #0052a3; }
            .info { background: #f5f5f5; padding: 15px; border-radius: 4px; margin: 20px 0; }
          </style>
        </head>
        <body>
          <h1>🌬️ Wisp Analysis Reports</h1>
          <div class="info">
            <p>Generated by GitHub Actions on ${{ github.run_id }}</p>
            <p>Commit: <code>${{ github.sha }}</code></p>
          </div>
          <div class="nav">
            <a href="dashboard.html">Interactive Dashboard</a>
            <a href="analysis/index.md">Markdown Report</a>
            <a href="dist/wisp.min.css">Download CSS</a>
            <a href="dist/wisp.min.js">Download JS</a>
          </div>
        </body>
        </html>
        EOF
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: analysis-report
        path: reports/

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./reports
        publish_branch: gh-pages
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: "docs: update analysis report [skip ci]"

  benchmark:
    runs-on: ubuntu-latest
    needs: analyze
    # Run on both push and PR, but not on scheduled runs
    if: github.event_name != 'schedule'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Run benchmarks
      run: |
        python3 << 'EOF' > benchmark.json
        import time
        import json
        import sys
        sys.path.insert(0, '.')
        from src.core.scanner import WispScanner
        
        # Load test content
        with open('tests/fixtures/blog-post.html') as f:
            content = f.read()
        
        results = {}
        
        # Benchmark 1: Analysis speed (100 iterations)
        start = time.perf_counter()
        for _ in range(100):
            scanner = WispScanner(content)
            scanner.analyze()
        results['analysis_100x_ms'] = (time.perf_counter() - start) * 1000
        
        # Benchmark 2: CSS generation (100 iterations)
        scanner = WispScanner(content)
        scanner.analyze()
        start = time.perf_counter()
        for _ in range(100):
            scanner.generate_css()
        results['css_gen_100x_ms'] = (time.perf_counter() - start) * 1000
        
        # Benchmark 3: Large content (10x size)
        large_content = content * 10
        start = time.perf_counter()
        scanner = WispScanner(large_content)
        scanner.analyze()
        results['large_content_10x_ms'] = (time.perf_counter() - start) * 1000
        
        # Single iteration times
        scanner = WispScanner(content)
        start = time.perf_counter()
        scanner.analyze()
        results['analysis_single_ms'] = (time.perf_counter() - start) * 1000
        
        start = time.perf_counter()
        scanner.generate_css()
        results['css_gen_single_ms'] = (time.perf_counter() - start) * 1000
        
        print(json.dumps(results, indent=2))
        EOF
        
        # Print to logs
        cat benchmark.json
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark.json

    - name: Comment PR with benchmark
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync('benchmark.json', 'utf8'));
          
          const body = `## ⚡ Performance Benchmark Results
          
          | Metric | Time |
          |--------|------|
          | Analysis (single) | ${b.analysis_single_ms.toFixed(3)} ms |
          | CSS Generation (single) | ${b.css_gen_single_ms.toFixed(3)} ms |
          | Analysis (100x) | ${b.analysis_100x_ms.toFixed(2)} ms |
          | CSS Generation (100x) | ${b.css_gen_100x_ms.toFixed(2)} ms |
          | Large Content (10x) | ${b.large_content_10x_ms.toFixed(2)} ms |
          
          <sub>Generated by GitHub Actions | Run #${{ github.run_number }}</sub>`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
    
    - name: Update commit status with benchmark
      if: github.event_name == 'push'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync('benchmark.json', 'utf8'));
          
          // Create a simple status check
          const avgTime = (b.analysis_single_ms + b.css_gen_single_ms) / 2;
          const state = avgTime < 10 ? 'success' : 'neutral';
          const description = `Analysis: ${b.analysis_single_ms.toFixed(2)}ms, CSS: ${b.css_gen_single_ms.toFixed(2)}ms`;
          
          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: state,
            context: 'Wisp Benchmark',
            description: description
          });