name: Wisp Analysis & Reporting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

# Add permissions at workflow level
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for gh-pages
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build and test
      run: |
        python scripts/build.py
        python tests/test_scanner.py
    
    - name: Generate reports
      run: |
        mkdir -p reports/analysis
        echo "# Wisp Analysis Report" > reports/analysis/index.md
        echo "Generated: $(date)" >> reports/analysis/index.md
        echo "" >> reports/analysis/index.md
        
        # Analyze fixtures
        for fixture in tests/fixtures/*.html; do
          echo "## $(basename $fixture)" >> reports/analysis/index.md
          python3 -c "
        import sys
        sys.path.insert(0, '.')
        from src.core.scanner import WispScanner
        with open('$fixture') as f:
            s = WispScanner(f.read())
            a = s.analyze()
        print(f'- **Context:** {a.context}')
        print(f'- **Pattern:** {a.pattern}')
        print(f'- **Density:** {a.density:.4f}')
        " >> reports/analysis/index.md
        done
        
        # Live examples
        python -m src.core.fetcher https://en.wikipedia.org/wiki/Wiki --css-only -o reports/analysis/wiki.css 2>&1 | tee -a reports/analysis/index.md || true
        
        # Dashboard
        python scripts/generate_dashboard.py
        cp public/dashboard.html reports/dashboard.html
        cp -r dist reports/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: analysis-report
        path: reports/

    # Deploy using GITHUB_TOKEN with write permissions
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./reports
        publish_branch: gh-pages
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

  benchmark:
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Run benchmarks
      run: |
        python3 -c "
        import time, json, sys
        sys.path.insert(0, '.')
        from src.core.scanner import WispScanner
        with open('tests/fixtures/blog-post.html') as f:
            content = f.read()
        results = {}
        start = time.perf_counter()
        for _ in range(100):
            WispScanner(content).analyze()
        results['analysis_100x'] = (time.perf_counter() - start) * 1000
        print(json.dumps(results))
        " > benchmark.json
    
    - name: Comment PR
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync('benchmark.json', 'utf8'));
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## ⚡ Benchmark\nAnalysis (100x): ${b.analysis_100x.toFixed(2)}ms`
          });