stages:
  - test
  - build
  - analyze
  - report

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Use Python image instead of Ruby
image: python:3.11-slim

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python --version
  - pip install virtualenv
  - virtualenv venv
  - source venv/bin/activate
  - pip install -r requirements.txt

test:
  stage: test
  script:
    - python tests/test_scanner.py
  artifacts:
    paths:
      - test-results.txt
    expire_in: 1 week

build:
  stage: build
  script:
    - python scripts/build.py
    - ls -lh dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 month

analyze:
  stage: analyze
  script:
    - mkdir -p public/analysis
    - |
      echo "# Wisp Analysis Report" > public/analysis/index.md
      echo "Pipeline: $CI_PIPELINE_ID | Branch: $CI_COMMIT_REF_NAME" >> public/analysis/index.md
      echo "Commit: $CI_COMMIT_SHORT_SHA" >> public/analysis/index.md
      echo "Date: $(date)" >> public/analysis/index.md
      echo "" >> public/analysis/index.md
    - |
      echo "## Test Fixtures" >> public/analysis/index.md
      for fixture in tests/fixtures/*.html; do
        echo "### $(basename $fixture)" >> public/analysis/index.md
        python3 << EOF >> public/analysis/index.md
      import sys
      sys.path.insert(0, '.')
      from src.core.scanner import WispScanner
      
      with open('$fixture') as f:
          scanner = WispScanner(f.read())
          a = scanner.analyze()
      
      print(f"- **Context:** \`{a.context}\`")
      print(f"- **Pattern:** \`{a.pattern}\`")
      print(f"- **Density:** \`{a.density:.4f}\`")
      print(f"- **Depth:** \`{a.depth}\`")
      print("")
      EOF
      done
    - |
      echo "## Live URL Tests" >> public/analysis/index.md
      python -m src.core.fetcher https://en.wikipedia.org/wiki/Wiki --css-only -o public/analysis/wiki.css 2>&1 | tee -a public/analysis/index.md || true
      python -m src.core.fetcher https://example.com --css-only -o public/analysis/example.css 2>&1 | tee -a public/analysis/index.md || true
    - |
      echo "## File Sizes" >> public/analysis/index.md
      echo "" >> public/analysis/index.md
      ls -lh dist/ >> public/analysis/index.md
    - |
      echo "## Interactive Dashboard" >> public/analysis/index.md
      echo "View the [interactive dashboard](../dashboard.html) for visual analysis." >> public/analysis/index.md
  artifacts:
    paths:
      - public/analysis/
    expire_in: 1 month
  only:
    - main
    - merge_requests

dashboard:
  stage: report
  script:
    - python scripts/generate_dashboard.py
    - mv public/dashboard.html public/dashboard-gitlab.html
  artifacts:
    paths:
      - public/dashboard-gitlab.html
    expire_in: 1 month
  only:
    - main

pages:
  stage: report
  dependencies:
    - build
    - analyze
    - dashboard
  script:
    - mkdir -p public
    - cp -r dist public/
    - |
      cat > public/index.html << 'EOF'
      <!DOCTYPE html>
      <html>
      <head>
        <title>Wisp - GitLab Pages</title>
        <meta charset="UTF-8">
        <style>
          body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
          h1 { color: #333; border-bottom: 2px solid #0066cc; padding-bottom: 10px; }
          .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin: 20px 0; }
          a { color: #0066cc; text-decoration: none; }
          a:hover { text-decoration: underline; }
          .button { display: inline-block; background: #0066cc; color: white; padding: 10px 20px; border-radius: 4px; margin: 5px; }
          .button:hover { background: #0052a3; text-decoration: none; }
          code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; }
        </style>
      </head>
      <body>
        <h1>🌬️ Wisp on GitLab Pages</h1>
        
        <div class="card">
          <h2>Pipeline Information</h2>
          <p><strong>Pipeline:</strong> <code>$CI_PIPELINE_ID</code></p>
          <p><strong>Branch:</strong> <code>$CI_COMMIT_REF_NAME</code></p>
          <p><strong>Commit:</strong> <code>$CI_COMMIT_SHORT_SHA</code></p>
          <p><strong>Date:</strong> $(date)</p>
        </div>
        
        <div class="card">
          <h2>Quick Links</h2>
          <a href="analysis/index.md" class="button">Analysis Report</a>
          <a href="dashboard-gitlab.html" class="button">Interactive Dashboard</a>
          <a href="dist/wisp.min.css" class="button">Download CSS</a>
          <a href="dist/wisp.min.js" class="button">Download JS</a>
        </div>
        
        <div class="card">
          <h2>About</h2>
          <p>Wisp is a context-aware, zero-dependency UI engine. This page is automatically generated by GitLab CI/CD.</p>
          <p>View this project on <a href="https://gitlab.com/rotsl/wisp">GitLab</a> or <a href="https://github.com/rotsl/wisp">GitHub</a>.</p>
        </div>
      </body>
      </html>
      EOF
  artifacts:
    paths:
      - public
  only:
    - main